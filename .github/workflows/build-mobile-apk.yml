name: Build Android test app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ivanfdioaplmajnaqxnf.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FNFpnKnLfvvDlOIwaWlikg_naH6bM3I
      EXPO_PUBLIC_PROJECT_COST_BRIDGE_ENABLED: 'false'
      EXPO_PUBLIC_PROJECT_COST_FORECAST_ENABLED: 'false'
      EXPO_PUBLIC_PROJECT_COST_PAYMENT_LINK_ENABLED: 'false'
      EXPO_PUBLIC_PROJECT_PROGRESS_VALUATION_ENABLED: 'false'
      EXPO_PUBLIC_PROJECT_PROGRESS_FIELD_REVIEW_ENABLED: 'false'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build standalone internal-test APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Charismak-App-Android-Test
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
