name: Build Validation

on:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Web type check
        run: npx tsc --noEmit
      - name: Web production build
        run: npm run build
