name: Accounting QA - Local Supabase

on:
  workflow_dispatch:

jobs:
  accounting-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Run application accounting guards
        run: npm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Run pgTAP accounting integrity tests
        run: supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
