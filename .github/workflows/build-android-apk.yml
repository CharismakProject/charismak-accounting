name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-beta-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Android beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare branded application icon
        run: |
          mkdir -p mobile/assets
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CharismakProject/charismak-website/main/public/branding/charismak-logo.png \
            --output /tmp/charismak-logo.png
          convert /tmp/charismak-logo.png -resize 760x760 -background white -gravity center -extent 1024x1024 mobile/assets/icon.png

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare downloadable file
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Charismak-Accounting-Android.apk
          mkdir -p public/downloads
          cp Charismak-Accounting-Android.apk public/downloads/Charismak-Accounting-Android.apk

      - name: Retain build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Charismak-Accounting-Android
          path: Charismak-Accounting-Android.apk
          retention-days: 30

      - name: Publish APK to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force public/downloads/Charismak-Accounting-Android.apk
          git commit -m "Publish Android beta APK"
          git push origin HEAD:main
